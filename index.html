<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CE Learning Tracker</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" />
  <style>
    :root {
      --bg: #f5f5f3;
      --surface: #ffffff;
      --surface2: #f0efeb;
      --border: rgba(0,0,0,0.10);
      --border-md: rgba(0,0,0,0.18);
      --text: #1a1a18;
      --text-sec: #6b6b66;
      --text-hint: #9b9b96;
      --green: #1D9E75;
      --green-dark: #0F6E56;
      --green-bg: #EAF3DE;
      --green-text: #3B6D11;
      --amber-bg: #FAEEDA;
      --amber-text: #854F0B;
      --red-bg: #FCEBEB;
      --red-text: #A32D2D;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1a;
        --surface: #252523;
        --surface2: #2e2e2b;
        --border: rgba(255,255,255,0.10);
        --border-md: rgba(255,255,255,0.18);
        --text: #f0efe8;
        --text-sec: #9b9b96;
        --text-hint: #6b6b66;
        --green-bg: #173404;
        --green-text: #C0DD97;
        --amber-bg: #412402;
        --amber-text: #FAC775;
        --red-bg: #501313;
        --red-text: #F7C1C1;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Layout ── */
    .container { max-width: 520px; margin: 0 auto; padding: 0 0 80px; }
    .main { }
    .tab-icon { display: none; }

    /* ── Header ── */
    .header {
      background: var(--surface);
      border-bottom: 0.5px solid var(--border);
      padding: 20px 20px 0;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .header-top h1 { font-size: 20px; font-weight: 600; }
    .header-top p { font-size: 13px; color: var(--text-sec); }
    .tab-bar { display: flex; gap: 2px; overflow-x: auto; }
    .tab {
      font-size: 13px; font-weight: 500; padding: 8px 14px;
      border: none; background: none; color: var(--text-sec);
      cursor: pointer; border-bottom: 2px solid transparent;
      font-family: inherit; transition: color 0.15s; white-space: nowrap;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--green); border-bottom-color: var(--green); }

    /* ── Stats ── */
    .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; padding: 16px 16px 0; }
    .stat {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--radius-md); padding: 12px; text-align: center;
    }
    .stat-num { font-size: 26px; font-weight: 600; }
    .stat-label { font-size: 11px; color: var(--text-sec); margin-top: 2px; }
    .stat.learn .stat-num { color: #E24B4A; }
    .stat.prog .stat-num { color: #BA7517; }
    .stat.know .stat-num { color: var(--green); }

    /* ── Content ── */
    .content { padding: 14px 16px; }

    /* ── Subject Cards ── */
    .subject-card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      margin-bottom: 10px;
      overflow: hidden;
    }
    .subject-card.current-sem { border-color: var(--green); }
    .subject-header {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; cursor: pointer;
      user-select: none;
    }
    .subject-header:hover { background: var(--surface2); }
    .subject-icon {
      width: 36px; height: 36px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .subject-info { flex: 1; min-width: 0; }
    .subject-name { font-size: 14px; font-weight: 500; }
    .progress-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
    .progress-track { flex: 1; height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--green); border-radius: 2px; transition: width 0.3s ease; }
    .progress-label { font-size: 11px; color: var(--text-hint); white-space: nowrap; }
    .chevron { color: var(--text-hint); font-size: 16px; transition: transform 0.2s; flex-shrink: 0; }
    .chevron.open { transform: rotate(180deg); }
    .del-sub-btn {
      background: none; border: none; cursor: pointer;
      color: var(--text-hint); font-size: 15px; padding: 4px;
      border-radius: 6px; flex-shrink: 0;
    }
    .del-sub-btn:hover { color: #E24B4A; background: var(--red-bg); }

    /* ── Lessons ── */
    .lessons-list { border-top: 0.5px solid var(--border); }
    .lesson-row {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 14px; border-bottom: 0.5px solid var(--border);
    }
    .lesson-row:last-of-type { border-bottom: none; }
    .lesson-name { flex: 1; font-size: 13px; }
    .badge {
      font-size: 10px; font-weight: 600; padding: 3px 9px;
      border-radius: 20px; border: none;
      font-family: inherit; white-space: nowrap;
      letter-spacing: 0.02em;
    }
    button.badge { cursor: pointer; transition: opacity 0.15s; }
    button.badge:hover { opacity: 0.75; }
    .badge.learn { background: var(--red-bg); color: var(--red-text); }
    .badge.progress { background: var(--amber-bg); color: var(--amber-text); }
    .badge.know { background: var(--green-bg); color: var(--green-text); }
    .del-btn {
      background: none; border: none; cursor: pointer;
      color: var(--text-hint); font-size: 14px; padding: 2px 4px; flex-shrink: 0;
    }
    .del-btn:hover { color: #E24B4A; }

    /* ── Add Lesson Row ── */
    .add-lesson-row {
      display: flex; gap: 6px; padding: 8px 14px;
      border-top: 0.5px solid var(--border);
      background: var(--surface2);
    }
    .add-lesson-row input {
      flex: 1; font-size: 13px; padding: 7px 10px;
      border: 0.5px solid var(--border-md); border-radius: var(--radius-sm);
      background: var(--surface); color: var(--text); font-family: inherit; outline: none;
    }
    .add-lesson-row input:focus { border-color: var(--green); }
    .btn-sm {
      font-size: 12px; font-weight: 500; padding: 7px 12px;
      background: var(--green); color: #fff; border: none;
      border-radius: var(--radius-sm); cursor: pointer; font-family: inherit;
      white-space: nowrap;
    }
    .btn-sm:hover { background: var(--green-dark); }

    /* ── Filter Bar ── */
    .filter-bar { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
    .filter-btn {
      font-size: 12px; font-weight: 500; padding: 5px 12px;
      border-radius: 20px; border: 0.5px solid var(--border-md);
      background: var(--surface); color: var(--text-sec);
      cursor: pointer; font-family: inherit; transition: all 0.15s;
    }
    .filter-btn:hover { background: var(--surface2); }
    .filter-btn.f-all.active { background: var(--surface2); color: var(--text); border-color: var(--border-md); }
    .filter-btn.f-learn.active { background: var(--red-bg); color: var(--red-text); border-color: var(--red-text); }
    .filter-btn.f-progress.active { background: var(--amber-bg); color: var(--amber-text); border-color: var(--amber-text); }
    .filter-btn.f-know.active { background: var(--green-bg); color: var(--green-text); border-color: var(--green-text); }

    /* ── Add Subject Tab ── */
    .add-subject-card {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--radius-lg); padding: 18px;
    }
    .add-subject-card h2 { font-size: 15px; font-weight: 600; margin-bottom: 14px; }
    .form-label { font-size: 12px; font-weight: 500; color: var(--text-sec); margin-bottom: 6px; display: block; }
    .form-group { margin-bottom: 14px; }
    .icon-grid { display: grid; grid-template-columns: repeat(6,1fr); gap: 6px; }
    .icon-opt {
      width: 42px; height: 42px; border-radius: 10px; border: 1.5px solid transparent;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; cursor: pointer; transition: border-color 0.15s;
      background: var(--surface2);
    }
    .icon-opt.selected { border-color: var(--green); }
    .color-grid { display: flex; gap: 8px; flex-wrap: wrap; }
    .color-opt {
      width: 26px; height: 26px; border-radius: 6px; cursor: pointer;
      border: 2px solid transparent; transition: border-color 0.15s;
    }
    .color-opt.selected { border-color: var(--green); }
    .name-row { display: flex; gap: 8px; }
    .name-row input {
      flex: 1; font-size: 14px; padding: 9px 12px;
      border: 0.5px solid var(--border-md); border-radius: var(--radius-sm);
      background: var(--surface); color: var(--text); font-family: inherit; outline: none;
    }
    .name-row input:focus { border-color: var(--green); }
    .btn-primary {
      font-size: 14px; font-weight: 600; padding: 9px 18px;
      background: var(--green); color: #fff; border: none;
      border-radius: var(--radius-sm); cursor: pointer; font-family: inherit;
    }
    .btn-primary:hover { background: var(--green-dark); }
    .tip-box {
      margin-top: 14px; padding: 10px 12px;
      background: var(--surface2); border-radius: var(--radius-sm);
      font-size: 12px; color: var(--text-sec); line-height: 1.5;
    }

    /* ── All Lessons ── */
    .group-label {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 600; color: var(--text-sec);
      margin-bottom: 6px; margin-top: 4px;
    }
    .empty {
      text-align: center; padding: 40px 16px;
      color: var(--text-hint); font-size: 14px;
    }
    .empty i { font-size: 36px; display: block; margin-bottom: 8px; }

    /* ── Static Panels (OJT + Acad) ── */
    .section-banner {
      background: var(--green-bg);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .section-banner-title { font-size: 14px; font-weight: 600; color: var(--green-text); }
    .section-banner-sub { font-size: 12px; color: var(--green-text); opacity: 0.8; margin-top: 3px; }
    .acad-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 12px; }
    .acad-stat {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--radius-md); padding: 10px; text-align: center;
    }
    .acad-stat-num { font-size: 22px; font-weight: 600; }
    .acad-stat-label { font-size: 10px; color: var(--text-sec); margin-top: 2px; }
    .acad-stat.done .acad-stat-num { color: var(--green); }
    .acad-stat.active .acad-stat-num { color: #BA7517; }
    .acad-stat.pending .acad-stat-num { color: #E24B4A; }
    .subj-code { font-size: 10px; color: var(--text-hint); font-family: monospace; flex-shrink: 0; }
    .subj-units { font-size: 11px; color: var(--text-hint); white-space: nowrap; flex-shrink: 0; }
    .current-sem-tag {
      font-size: 10px; font-weight: 600; padding: 2px 7px;
      border-radius: 20px; background: var(--green-bg); color: var(--green-text);
      margin-left: 6px; vertical-align: middle;
    }

    /* ── Schedule Tab ── */
    .sched-sub { display: flex; gap: 6px; margin-bottom: 14px; }
    .sched-sub-btn {
      font-size: 12px; font-weight: 500; padding: 5px 14px;
      border-radius: 20px; border: 0.5px solid var(--border-md);
      background: var(--surface); color: var(--text-sec);
      cursor: pointer; font-family: inherit; transition: all 0.15s;
    }
    .sched-sub-btn.active { background: var(--green); color: #fff; border-color: var(--green); }
    .class-card {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--radius-md); padding: 10px 14px;
      margin-bottom: 8px; display: flex; align-items: center; gap: 10px;
    }
    .class-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .class-info { flex: 1; min-width: 0; }
    .class-name { font-size: 13px; font-weight: 500; }
    .class-room { font-size: 11px; color: var(--text-hint); margin-top: 1px; }
    .class-time { font-size: 11px; color: var(--text-hint); white-space: nowrap; flex-shrink: 0; }
    .event-card {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--radius-md); padding: 10px 14px;
      margin-bottom: 8px; display: flex; align-items: center; gap: 10px;
    }
    .event-type-badge {
      font-size: 9px; font-weight: 700; padding: 3px 8px; border-radius: 20px;
      white-space: nowrap; flex-shrink: 0; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .event-type-badge.exam { background: var(--red-bg);   color: var(--red-text);   }
    .event-type-badge.quiz { background: var(--amber-bg); color: var(--amber-text); }
    .event-type-badge.lab  { background: var(--green-bg); color: var(--green-text); }
    .event-type-badge.act  { background: #E6F1FB; color: #1a5276; }
    .event-info { flex: 1; min-width: 0; }
    .event-name { font-size: 13px; font-weight: 500; }
    .event-when { font-size: 11px; color: var(--text-hint); margin-top: 1px; }
    .day-block { margin-bottom: 16px; }
    .day-label {
      font-size: 12px; font-weight: 600; color: var(--text-sec);
      margin-bottom: 6px; display: flex; align-items: center; gap: 6px;
    }
    .day-label.today-label { color: var(--green); }
    .notif-bar {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--radius-md); padding: 10px 14px; margin-bottom: 12px;
    }
    .notif-bar-label { font-size: 12px; color: var(--text-sec); }
    .notif-btn {
      font-size: 11px; font-weight: 600; padding: 4px 12px;
      border-radius: 20px; border: none; cursor: pointer; font-family: inherit;
    }
    .notif-btn.on  { background: var(--green-bg); color: var(--green-text); cursor: default; }
    .notif-btn.off { background: var(--surface2); color: var(--text-sec); }
    .sched-form {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--radius-lg); padding: 16px; margin-bottom: 14px;
    }
    .sched-form h3 { font-size: 13px; font-weight: 600; margin-bottom: 12px; }
    .sched-input {
      width: 100%; font-size: 13px; padding: 7px 10px;
      border: 0.5px solid var(--border-md); border-radius: var(--radius-sm);
      background: var(--surface); color: var(--text); font-family: inherit;
      outline: none; margin-bottom: 10px; display: block;
    }
    .sched-input:focus { border-color: var(--green); }
    .day-checks { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .day-check {
      font-size: 11px; font-weight: 600; padding: 4px 10px;
      border-radius: 20px; border: 1.5px solid var(--border-md);
      cursor: pointer; user-select: none; transition: all 0.15s;
      color: var(--text-sec); background: var(--surface);
    }
    .day-check.selected { border-color: var(--green); background: var(--green-bg); color: var(--green-text); }
    .sched-time-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
    .sched-time-row .sched-input { margin-bottom: 0; flex: 1; }
    .time-lbl { font-size: 11px; color: var(--text-sec); white-space: nowrap; }
    .cpick-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .cpick {
      width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
      border: 2px solid transparent; transition: border-color 0.15s;
    }
    .cpick.selected { border-color: var(--text); }
    .sched-section-lbl { font-size: 12px; font-weight: 600; color: var(--text-sec); margin: 14px 0 6px; }

    /* ── Toast Notifications ── */
    #toast-container {
      position: fixed; bottom: 20px; right: 16px; z-index: 9999;
      display: flex; flex-direction: column-reverse; gap: 8px;
      max-width: 310px; pointer-events: none;
    }
    .toast {
      background: var(--surface); border: 0.5px solid var(--border-md);
      border-radius: var(--radius-md); padding: 12px 14px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.18);
      display: flex; gap: 10px; align-items: flex-start;
      pointer-events: all; animation: toast-in 0.25s ease;
    }
    .toast-icon { font-size: 18px; flex-shrink: 0; line-height: 1.3; }
    .toast-body { flex: 1; min-width: 0; }
    .toast-title { font-size: 13px; font-weight: 600; }
    .toast-sub { font-size: 11px; color: var(--text-sec); margin-top: 2px; line-height: 1.4; }
    .toast-close {
      background: none; border: none; cursor: pointer;
      color: var(--text-hint); font-size: 14px; padding: 0; flex-shrink: 0; line-height: 1;
    }
    @keyframes toast-in { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }

    /* ── Desktop Sidebar Layout ── */
    @media (min-width: 768px) {
      html, body { height: 100%; overflow: hidden; }

      .container {
        display: flex; flex-direction: row;
        max-width: 100%; margin: 0; padding: 0;
        height: 100vh;
      }

      /* Sidebar */
      .header {
        width: 220px; flex-shrink: 0;
        position: static;
        border-bottom: none;
        border-right: 0.5px solid var(--border);
        height: 100vh; overflow-y: auto;
        padding: 28px 0 40px;
        display: flex; flex-direction: column;
      }
      .header-top { padding: 0 18px; margin-bottom: 20px; }
      .header-top h1 { font-size: 16px; }
      .header-top p  { font-size: 12px; }

      /* Vertical nav tabs */
      .tab-bar {
        flex-direction: column; gap: 2px;
        overflow-x: visible; padding: 0 10px;
        flex: 1;
      }
      .tab {
        border-bottom-width: 0;
        border-left: 3px solid transparent;
        border-radius: var(--radius-sm);
        text-align: left; padding: 10px 12px;
        display: flex; align-items: center; gap: 10px;
        width: 100%;
      }
      .tab:hover { background: var(--surface2); }
      .tab.active {
        background: var(--surface2);
        border-left-color: var(--green);
        border-bottom-color: transparent;
      }
      .tab-icon { display: inline-block; font-size: 17px; flex-shrink: 0; }

      /* Main scrollable area */
      .main { flex: 1; overflow-y: auto; height: 100vh; }
      .stats { padding: 20px 24px 0; max-width: none; }
      .content { padding: 14px 24px 40px; }

      /* Wider cards on desktop */
      .subject-card, .add-subject-card,
      .sched-form, .section-banner,
      .api-setup-card { max-width: 780px; }
    }
  </style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="header-top">
      <div>
        <h1>CE Learning Tracker</h1>
        <p id="header-sub">Track your progress across all subjects</p>
      </div>
    </div>
    <div class="tab-bar">
      <button class="tab active" data-tab="subjects" onclick="switchTab('subjects')"><i class="ti ti-books tab-icon"></i><span>Subjects</span></button>
      <button class="tab" data-tab="all" onclick="switchTab('all')"><i class="ti ti-list tab-icon"></i><span>All Lessons</span></button>
      <button class="tab" data-tab="add" onclick="switchTab('add')"><i class="ti ti-plus tab-icon"></i><span>Add Subject</span></button>
      <button class="tab" data-tab="ojt" onclick="switchTab('ojt')"><i class="ti ti-shield tab-icon"></i><span>OJT Guide</span></button>
      <button class="tab" data-tab="acad" onclick="switchTab('acad')"><i class="ti ti-school tab-icon"></i><span>Acad Plan</span></button>
      <button class="tab" data-tab="sched" onclick="switchTab('sched')"><i class="ti ti-calendar tab-icon"></i><span>Schedule</span></button>
    </div>
  </div>

  <div class="main">
  <div class="stats">
    <div class="stat learn"><div class="stat-num" id="stat-learn">0</div><div class="stat-label">To learn</div></div>
    <div class="stat prog"><div class="stat-num" id="stat-prog">0</div><div class="stat-label">In progress</div></div>
    <div class="stat know"><div class="stat-num" id="stat-know">0</div><div class="stat-label">Known</div></div>
  </div>

  <div class="content">
    <!-- Subjects Tab -->
    <div id="tab-subjects"></div>

    <!-- All Lessons Tab -->
    <div id="tab-all" style="display:none">
      <div class="filter-bar">
        <button class="filter-btn f-all active" onclick="setFilter('all')">All (<span id="fc-all">0</span>)</button>
        <button class="filter-btn f-learn" onclick="setFilter('learn')">To learn (<span id="fc-learn">0</span>)</button>
        <button class="filter-btn f-progress" onclick="setFilter('progress')">In progress (<span id="fc-progress">0</span>)</button>
        <button class="filter-btn f-know" onclick="setFilter('know')">Known (<span id="fc-know">0</span>)</button>
      </div>
      <div id="all-lessons-list"></div>
    </div>

    <!-- OJT Guide Tab -->
    <div id="tab-ojt" style="display:none">
      <div id="ojt-content"></div>
    </div>

    <!-- Acad Plan Tab -->
    <div id="tab-acad" style="display:none">
      <div id="acad-content"></div>
    </div>

    <!-- Schedule Tab -->
    <div id="tab-sched" style="display:none">
      <div id="sched-content"></div>
    </div>

    <!-- Add Subject Tab -->
    <div id="tab-add" style="display:none">
      <div class="add-subject-card">
        <h2>New subject</h2>
        <div class="form-group">
          <label class="form-label">Choose an icon</label>

  function nextStatus(s) {
    return s === "learn" ? "progress" : s === "progress" ? "know" : "learn";
  }
  function badgeMeta(s) {
    if (s === "know")     return { cls:"know",     label:"Already know" };
    if (s === "progress") return { cls:"progress", label:"In progress"  };
    return                       { cls:"learn",    label:"To learn"     };
  }

  // ── Tab switching ─────────────────────────────────────────────────────────
  function switchTab(tab) {
    activeTab = tab;
    ["subjects","all","ojt","acad","add","sched"].forEach(t => {
      document.getElementById("tab-"+t).style.display = t === tab ? "" : "none";
      document.querySelector(`[data-tab="${t}"]`).classList.toggle("active", t === tab);
    });
    render();
  }

  // ── Render stats ──────────────────────────────────────────────────────────
  function renderStats() {
    const all = subjects.flatMap(s => s.lessons);
    const learn = all.filter(l => l.status === "learn").length;
    const prog  = all.filter(l => l.status === "progress").length;
    const know  = all.filter(l => l.status === "know").length;
    document.getElementById("stat-learn").textContent = learn;
    document.getElementById("stat-prog").textContent  = prog;
    document.getElementById("stat-know").textContent  = know;
    document.getElementById("fc-all").textContent      = all.length;
    document.getElementById("fc-learn").textContent    = learn;
    document.getElementById("fc-progress").textContent = prog;
    document.getElementById("fc-know").textContent     = know;
    document.getElementById("header-sub").textContent =
      `${know} known · ${prog} in progress · ${learn} to learn`;
  }

  // ── Render subjects tab ───────────────────────────────────────────────────
  function renderSubjects() {
    const wrap = document.getElementById("tab-subjects");
    if (subjects.length === 0) {
      wrap.innerHTML = `<div class="empty"><i class="ti ti-books"></i>No subjects yet. Go to "+ Add Subject"!</div>`;
      return;
    }
    wrap.innerHTML = subjects.map(s => {
      const know = s.lessons.filter(l => l.status === "know").length;
      const pct  = s.lessons.length ? Math.round((know / s.lessons.length) * 100) : 0;
      const isOpen = !!openSubs[s.id];
      const lessonsHTML = isOpen ? `
        <div class="lessons-list">
          ${s.lessons.length === 0
            ? `<div style="padding:10px 14px;font-size:13px;color:var(--text-hint)">No lessons yet. Add one below.</div>`
            : s.lessons.map(l => {
                const m = badgeMeta(l.status);
                return `
                  <div class="lesson-row">
                    <span class="lesson-name">${esc(l.name)}</span>
                    <button class="badge ${m.cls}" onclick="cycleStatus('${s.id}','${l.id}')" title="Tap to cycle status">${m.label}</button>
                    <button class="del-btn" onclick="delLesson('${s.id}','${l.id}')" title="Delete"><i class="ti ti-x"></i></button>
                  </div>`;
              }).join("")}

            <input type="text" id="nl-${s.id}" placeholder="Add a lesson..." onkeydown="if(event.key==='Enter')addLesson('${s.id}')" />

          </div>
        </div>` : "";

        <div class="subject-card">
          <div class="subject-header" onclick="toggleSub('${s.id}')">
            <div class="subject-icon" style="background:${s.color}">${s.icon}</div>

              <div class="subject-name">${esc(s.name)}</div>

  function renderAll() {
    const wrap = document.getElementById("all-lessons-list");
    document.querySelectorAll(".filter-btn").forEach(b => {
      b.classList.toggle("active", b.classList.contains("f-"+filter));
    });
    const groups = subjects.map(s => ({
      ...s,
      filtered: s.lessons.filter(l => filter === "all" || l.status === filter)
    })).filter(s => s.filtered.length > 0);

    if (groups.length === 0) {
      wrap.innerHTML = `<div class="empty"><i class="ti ti-mood-smile"></i>No lessons here yet!</div>`;
      return;
    }
    wrap.innerHTML = groups.map(s => `
      <div class="group-label">${s.icon} ${esc(s.name)}</div>
      <div class="subject-card" style="margin-bottom:14px">
        <div class="lessons-list">
          ${s.filtered.map(l => {
            const m = badgeMeta(l.status);
            return `
              <div class="lesson-row">
                <span class="lesson-name">${esc(l.name)}</span>
                <button class="badge ${m.cls}" onclick="cycleStatus('${s.id}','${l.id}')" title="Tap to cycle">${m.label}</button>
              </div>`;
          }).join("")}
        </div>
      </div>`).join("");
  }

  function renderAddTab() {
    const ig = document.getElementById("icon-grid");
    if (ig && ig.children.length === 0) {
      ig.innerHTML = ICONS.map(ic =>
        `<div class="icon-opt${ic===newIcon?" selected":""}" onclick="pickIcon('${ic}')">${ic}</div>`
      ).join("");

    const cg = document.getElementById("color-grid");
    if (cg && cg.children.length === 0) {
      cg.innerHTML = COLORS.map(c =>
        `<div class="color-opt${c===newColor?" selected":""}" style="background:${c}" onclick="pickColor('${c}')"></div>`
      ).join("");
    }
  }

  function render() {
    renderStats();
    if (activeTab === "subjects") renderSubjects();
    if (activeTab === "all")      renderAll();
    if (activeTab === "add")      renderAddTab();
    if (activeTab === "ojt")      renderOjt();
    if (activeTab === "acad")     renderAcad();
    if (activeTab === "sched")    renderSchedule();
  }

  // ── Actions ───────────────────────────────────────────────────────────────
  function toggleSub(sid) {
    openSubs[sid] = !openSubs[sid];
    renderSubjects();
  }

  function cycleStatus(sid, lid) {
    subjects = subjects.map(s => s.id !== sid ? s : {
      ...s, lessons: s.lessons.map(l => l.id !== lid ? l : { ...l, status: nextStatus(l.status) })
    });
    save(); render();
  }

  function delLesson(sid, lid) {
    subjects = subjects.map(s => s.id !== sid ? s : {
      ...s, lessons: s.lessons.filter(l => l.id !== lid)
    });
    save(); render();
  }

  function addLesson(sid) {
    const el = document.getElementById("nl-"+sid);
    const name = (el?.value || "").trim();
    if (!name) return;
    subjects = subjects.map(s => s.id !== sid ? s : {
      ...s, lessons: [...s.lessons, { id: uid(), name, status: "learn" }]
    });
    save(); render();
    setTimeout(() => { const el2 = document.getElementById("nl-"+sid); if(el2) el2.focus(); }, 10);
  }

  function delSubject(sid) {
    if (!confirm("Delete this subject and all its lessons?")) return;
    subjects = subjects.filter(s => s.id !== sid);
    save(); render();
  }

  function pickIcon(ic) {
    newIcon = ic;
    document.querySelectorAll(".icon-opt").forEach(el => {
      el.classList.toggle("selected", el.textContent === ic);
    });
  }

  function pickColor(c) {
    newColor = c;
    document.querySelectorAll(".color-opt").forEach(el => {
      el.classList.toggle("selected", el.style.background === c ||

    });

    const name = (document.getElementById("new-sub-name")?.value || "").trim();

    subjects.push({ id: uid(), name, icon: newIcon, color: newColor, lessons: [] });
    save();
    document.getElementById("new-sub-name").value = "";
    switchTab("subjects");

      {code:"NCP 4102",name:"DSP Lec",units:3,status:"pending"},
      {code:"NCP 4103",name:"DSP Lab",units:1,status:"pending"},
      {code:"NCP 4980",name:"CpE Practice and Design 1",units:1,status:"pending"},
      {code:"NCP EL03",name:"CpE Track 2",units:3,status:"pending"},
      {code:"NCP EL04",name:"CpE Track 2 Lab",units:1,status:"pending"},
      {code:"ZGE 1101",name:"Art Appreciation",units:3,status:"enrolled"},
      {code:"ZGE 1102",name:"The Contemporary World",units:3,status:"enrolled"},
      {code:"ZGE 1103",name:"Ethics",units:3,status:"credited"},
      {code:"ZGE EL03",name:"GE Elective 3",units:3,status:"enrolled"},
    ]},
    { id:"s42", label:"4th Year — 2nd Sem", current:false, subjects:[
      {code:"NCP 3107",name:"Technopreneurship",units:3,status:"pending"},
      {code:"NCP 3207",name:"Occupational Health and Safety",units:3,status:"pending"},
      {code:"NCP 4106",name:"Engineering Economics",units:3,status:"pending"},
      {code:"NCP 4201",name:"Emerging Technologies",units:3,status:"pending"},
      {code:"NCP 4203",name:"Seminars and Field Trips",units:2,status:"pending"},
      {code:"NCP 4990",name:"CpE Practice and Design 2",units:2,status:"pending"},
      {code:"NCP EL05",name:"CpE Track 3",units:3,status:"pending"},
      {code:"NCP EL06",name:"CpE Track 3 Lab",units:1,status:"pending"},
    ]},
  ];

  let CURRICULUM = JSON.parse(localStorage.getItem("ce_curriculum")) || DEFAULT_CURRICULUM;

  function saveCurriculum() {
    localStorage.setItem("ce_curriculum", JSON.stringify(CURRICULUM));
  }

  function acadSubjectMeta(code) {
    if (code.startsWith("NCP") || code.startsWith("NEC")) return { icon:"💻", color:"#E6F1FB" };
    if (code.startsWith("NEE"))  return { icon:"⚡", color:"#FAEEDA" };
    if (code.startsWith("NMA"))  return { icon:"📐", color:"#E1F5EE" };
    if (code.startsWith("NPH"))  return { icon:"🔬", color:"#E3F2FD" };
    if (code.startsWith("NCH"))  return { icon:"🧮", color:"#EAF3DE" };
    if (code.startsWith("ZGE") || code.startsWith("ZPD")) return { icon:"📚", color:"#F3E5F5" };
    if (code.startsWith("PPE"))  return { icon:"🏃", color:"#E8F5E9" };
    return { icon:"📋", color:"#FAF0E1" };
  }

  function syncAcadToSubjects() {
    CURRICULUM.forEach(sem => {
      sem.subjects.forEach(s => {
        if (s.status !== "enrolled") return;
        if (subjects.find(sub => sub.acadCode === s.code)) return;
        const meta = acadSubjectMeta(s.code);
        subjects.push({ id: uid(), name: s.name, icon: meta.icon, color: meta.color, lessons: [], acadCode: s.code });
      });
    });
    save();
  }

  function cycleAcadStatus(semId, code) {
    const order = ["pending", "enrolled", "credited"];
    CURRICULUM.forEach(sem => {
      if (sem.id !== semId) return;
      sem.subjects.forEach(s => {
        if (s.code !== code) return;
        s.status = order[(order.indexOf(s.status) + 1) % order.length];
      });
    });
    saveCurriculum();
    syncAcadToSubjects();
    render();
  }

  let acadInitialized = false;

  function acadStatusMeta(st) {
    if (st === "credited") return { cls:"know",     label:"Credited" };
    if (st === "enrolled") return { cls:"progress", label:"Enrolled"  };
    return                        { cls:"learn",    label:"Pending"   };
  }

  function renderAcad() {
    const wrap = document.getElementById("acad-content");
    if (!wrap) return;

    if (!acadInitialized) {
      panelOpen["acad-s31"] = true;
      acadInitialized = true;
    }

    let creditedU = 0, enrolledU = 0, pendingU = 0;
    CURRICULUM.forEach(sem => sem.subjects.forEach(s => {
      if (s.status === "credited")      creditedU += s.units;
      else if (s.status === "enrolled") enrolledU += s.units;
      else                              pendingU  += s.units;
    }));

    wrap.innerHTML = `
      <div class="section-banner">
        <div class="section-banner-title">🎓 CpE Academic Planner</div>
        <div class="section-banner-sub">Full curriculum · tap a semester to expand</div>
      </div>
      <div class="acad-stats">
        <div class="acad-stat done">
          <div class="acad-stat-num">${creditedU}</div>
          <div class="acad-stat-label">Units Done</div>
        </div>
        <div class="acad-stat active">
          <div class="acad-stat-num">${enrolledU}</div>
          <div class="acad-stat-label">Enrolled</div>
        </div>
        <div class="acad-stat pending">
          <div class="acad-stat-num">${pendingU}</div>
          <div class="acad-stat-label">Remaining</div>
        </div>
      </div>
      ${CURRICULUM.map(sem => {
        const doneU  = sem.subjects.filter(s=>s.status==="credited").reduce((a,s)=>a+s.units,0);
        const totalU = sem.subjects.reduce((a,s)=>a+s.units,0);
        const pct    = totalU ? Math.round(doneU/totalU*100) : 0;
        const key    = "acad-" + sem.id;
        const isOpen = !!panelOpen[key];
        return `
          <div class="subject-card${sem.current?" current-sem":""}">
            <div class="subject-header" onclick="togglePanel('${key}')">
              <div class="subject-info" style="margin-left:0">
                <div class="subject-name">${esc(sem.label)}${sem.current?'<span class="current-sem-tag">Current</span>':""}</div>
                <div class="progress-row">
                  <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
                  <span class="progress-label">${doneU}/${totalU} units done</span>
                </div>
              </div>
              <i class="ti ti-chevron-down chevron${isOpen?" open":""}" id="chev-${key}"></i>
            </div>
            <div class="lessons-list" id="panel-${key}" style="display:${isOpen?"":"none"}">
              ${sem.subjects.map(s => {
                const m = acadStatusMeta(s.status);
                return `
                  <div class="lesson-row">
                    <span class="subj-code">${esc(s.code)}</span>
                    <span class="lesson-name">${esc(s.name)}</span>
                    <span class="subj-units">${s.units}u</span>
                    <button class="badge ${m.cls}" onclick="cycleAcadStatus('${sem.id}','${s.code}')">${m.label}</button>
                  </div>`;
              }).join("")}
            </div>
          </div>`;
      }).join("")}`;
  }

  // ── Schedule ──────────────────────────────────────────────────────────────
  let schedClasses = JSON.parse(localStorage.getItem("ce_classes")) || [];
  let schedEvts    = JSON.parse(localStorage.getItem("ce_events"))  || [];
  let schedView    = "today";
  let newClassDays  = [];
  let newClassColor = COLORS[4];

  const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat"];

  function saveSchedClasses() { localStorage.setItem("ce_classes", JSON.stringify(schedClasses)); }
  function saveSchedEvts()    { localStorage.setItem("ce_events",  JSON.stringify(schedEvts)); }
  function setSchedView(v)    { schedView = v; renderSchedule(); }

  function renderSchedule() {
    const wrap = document.getElementById("sched-content");
    if (!wrap) return;
    const perm = (typeof Notification !== "undefined") ? Notification.permission : "denied";
    wrap.innerHTML = `
      <div class="notif-bar">
        <span class="notif-bar-label">🔔 In-app alerts — always on while app is open${perm === "granted" ? " · Push enabled" : ""}</span>
        ${perm === "granted"
          ? `<span class="notif-btn on">Push on</span>`
          : `<button class="notif-btn off" onclick="enableNotif()" title="iPhone: in-app alerts work even without this">+ Push</button>`}
      </div>
      <div class="sched-sub">
        <button class="sched-sub-btn${schedView==="today"?" active":""}" onclick="setSchedView('today')">Today</button>
        <button class="sched-sub-btn${schedView==="weekly"?" active":""}" onclick="setSchedView('weekly')">Weekly</button>
        <button class="sched-sub-btn${schedView==="events"?" active":""}" onclick="setSchedView('events')">Exams &amp; Quizzes</button>
      </div>
      ${schedView === "today"  ? renderSchedToday()  : ""}
      ${schedView === "weekly" ? renderSchedWeekly() : ""}
      ${schedView === "events" ? renderSchedEvents() : ""}`;
  }

  function renderSchedToday() {
    const now = new Date();
    const dayName  = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][now.getDay()];
    const todayStr = now.toISOString().split("T")[0];
    const dateLabel = now.toLocaleDateString("en-PH", { weekday:"long", month:"long", day:"numeric" });
    const todayClasses = schedClasses
      .filter(c => c.days.includes(dayName))
      .sort((a,b) => a.startTime.localeCompare(b.startTime));
    const upcoming = schedEvts
      .filter(e => e.date >= todayStr)
      .sort((a,b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time))
      .slice(0, 6);
    let html = `<div class="day-label today-label" style="margin-bottom:10px">📅 ${esc(dateLabel)}</div>`;
    html += todayClasses.length === 0
      ? `<div class="empty" style="padding:16px 0 10px"><i class="ti ti-coffee"></i>No classes today!</div>`
      : todayClasses.map(schedClassCard).join("");
    if (upcoming.length > 0) {
      html += `<div class="sched-section-lbl" style="margin-top:18px">📝 Upcoming Exams &amp; Quizzes</div>`;
      html += upcoming.map(e => schedEventCard(e)).join("");
    }
    return html;
  }

  function renderSchedWeekly() {
    const todayName = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date().getDay()];
    let html = `
      <div class="sched-form">
        <h3>Add Class</h3>
        <input class="sched-input" type="text" id="cls-name" placeholder="Subject name" />
        <div class="day-checks">
          ${DAYS.map(d => `<span class="day-check${newClassDays.includes(d)?" selected":""}" onclick="toggleDay('${d}')">${d}</span>`).join("")}
        </div>
        <div class="sched-time-row">
          <span class="time-lbl">From</span>
          <input class="sched-input" type="time" id="cls-start" />
          <span class="time-lbl">To</span>
          <input class="sched-input" type="time" id="cls-end" />
        </div>
        <input class="sched-input" type="text" id="cls-room" placeholder="Room / location (optional)" />
        <div class="cpick-row">
          ${COLORS.map(c => `<div class="cpick${c===newClassColor?" selected":""}" style="background:${c}" onclick="pickClassColor('${c}')"></div>`).join("")}
        </div>
        <button class="btn-primary" style="width:100%" onclick="addSchedClass()">Add Class</button>
      </div>`;
    html += DAYS.map(day => {
      const dayCls = schedClasses.filter(c => c.days.includes(day)).sort((a,b) => a.startTime.localeCompare(b.startTime));
      const isToday = day === todayName;
      return `
        <div class="day-block">
          <div class="day-label${isToday?" today-label":""}">
            ${isToday?"📅 ":""}${day}${isToday?` <span style="font-weight:400;color:var(--text-hint)">(Today)</span>`:""}
          </div>
          ${dayCls.length === 0
            ? `<div style="font-size:12px;color:var(--text-hint);padding:2px 0 6px">No classes</div>`
            : dayCls.map(schedClassCard).join("")}
        </div>`;
    }).join("");
    return html;
  }

  function renderSchedEvents() {
    const todayStr = new Date().toISOString().split("T")[0];
    let html = `
      <div class="sched-form">
        <h3>Add Exam / Quiz</h3>
        <select class="sched-input" id="evt-type">
          <option value="exam">Exam</option>
          <option value="quiz">Quiz</option>
          <option value="lab">Lab</option>
          <option value="act">Activity</option>
        </select>
        <input class="sched-input" type="text" id="evt-subj" placeholder="Subject name" />
        <div class="sched-time-row">
          <span class="time-lbl">Date</span>
          <input class="sched-input" type="date" id="evt-date" />
          <span class="time-lbl">Time</span>
          <input class="sched-input" type="time" id="evt-time" />
        </div>
        <input class="sched-input" type="text" id="evt-notes" placeholder="Notes / coverage (optional)" />
        <button class="btn-primary" style="width:100%" onclick="addSchedEvent()">Add</button>
      </div>`;
    const sorted   = [...schedEvts].sort((a,b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time));
    const upcoming = sorted.filter(e => e.date >= todayStr);
    const past     = sorted.filter(e => e.date <  todayStr);
    if (upcoming.length === 0 && past.length === 0) {
      html += `<div class="empty" style="padding:16px 0"><i class="ti ti-calendar-event"></i>No exams or quizzes yet.</div>`;
    }
    if (upcoming.length > 0) {
      html += `<div class="sched-section-lbl">Upcoming</div>` + upcoming.map(e => schedEventCard(e)).join("");
    }
    if (past.length > 0) {
      html += `<div class="sched-section-lbl" style="margin-top:10px">Past</div>` + past.map(e => schedEventCard(e, true)).join("");
    }
    return html;
  }

  function schedClassCard(c) {
    return `
      <div class="class-card">
        <div class="class-dot" style="background:${c.color}"></div>
        <div class="class-info">
          <div class="class-name">${esc(c.name)}</div>
          ${c.room ? `<div class="class-room">${esc(c.room)}</div>` : ""}
        </div>
        <div class="class-time">${c.startTime}–${c.endTime}</div>
        <button class="del-btn" onclick="deleteSchedClass('${c.id}')"><i class="ti ti-x"></i></button>
      </div>`;
  }

  function schedEventCard(e, past = false) {
    const d = new Date(e.date + "T00:00:00");
    const label = d.toLocaleDateString("en-PH", { month:"short", day:"numeric", year:"numeric" });
    return `
      <div class="event-card" style="${past?"opacity:0.5":""}">
        <span class="event-type-badge ${e.type}">${e.type}</span>
        <div class="event-info">
          <div class="event-name">${esc(e.subject)}</div>
          <div class="event-when">${esc(label)} · ${e.time}${e.notes ? " · " + esc(e.notes) : ""}</div>
        </div>
        <button class="del-btn" onclick="deleteSchedEvent('${e.id}')"><i class="ti ti-x"></i></button>
      </div>`;
  }

  function toggleDay(day) {
    if (newClassDays.includes(day)) newClassDays = newClassDays.filter(d => d !== day);
    else newClassDays.push(day);
    document.querySelectorAll(".day-check").forEach(el =>
      el.classList.toggle("selected", newClassDays.includes(el.textContent.trim()))
    );
  }

  function pickClassColor(c) {
    newClassColor = c;
    document.querySelectorAll(".cpick").forEach(el =>
      el.classList.toggle("selected", el.style.background === c || el.style.backgroundColor === c)
    );
  }

  function addSchedClass() {
    const name  = (document.getElementById("cls-name")?.value || "").trim();
    const start = document.getElementById("cls-start")?.value;
    const end   = document.getElementById("cls-end")?.value;
    if (!name || newClassDays.length === 0 || !start || !end) {
      alert("Please enter a subject name, pick at least one day, and set start/end times.");
      return;
    }
    schedClasses.push({
      id: uid(), name, days: [...newClassDays], startTime: start, endTime: end,
      room: (document.getElementById("cls-room")?.value || "").trim(),
      color: newClassColor
    });
    saveSchedClasses();
    scheduleNotificationsToday();
    newClassDays = [];
    renderSchedule();
  }

  function deleteSchedClass(id) {
    schedClasses = schedClasses.filter(c => c.id !== id);
    saveSchedClasses();
    renderSchedule();
  }

  function addSchedEvent() {
    const type  = document.getElementById("evt-type")?.value;
    const subj  = (document.getElementById("evt-subj")?.value || "").trim();
    const date  = document.getElementById("evt-date")?.value;
    const time  = document.getElementById("evt-time")?.value;
    const notes = (document.getElementById("evt-notes")?.value || "").trim();
    if (!subj || !date || !time) { alert("Please fill in subject, date, and time."); return; }
    schedEvts.push({ id: uid(), type, subject: subj, date, time, notes });
    saveSchedEvts();
    renderSchedule();
  }

  function deleteSchedEvent(id) {
    schedEvts = schedEvts.filter(e => e.id !== id);
    saveSchedEvts();
    renderSchedule();
  }

  function showToast(title, body, icon, duration) {
    icon = icon || "🔔";
    duration = duration || 6000;
    const container = document.getElementById("toast-container");
    if (!container) return;
    const el = document.createElement("div");
    el.className = "toast";
    el.innerHTML = `<span class="toast-icon">${icon}</span>
      <div class="toast-body"><div class="toast-title">${title}</div>${body ? `<div class="toast-sub">${body}</div>` : ""}</div>
      <button class="toast-close" onclick="this.closest('.toast').remove()">✕</button>`;
    container.appendChild(el);
    setTimeout(() => el.remove(), duration);
  }

  function enableNotif() {
    if (!("Notification" in window)) {
      showToast("Not supported", "In-app alerts are always active. Push notifications aren't supported on this browser.", "ℹ️");
      return;
    }
    Notification.requestPermission().then(perm => {
      renderSchedule();
      if (perm === "granted") scheduleNotificationsToday();
      else showToast("Push blocked", "In-app alerts will still appear while the app is open.", "ℹ️");
    });
  }

  function scheduleNotificationsToday() {
    const now      = new Date();
    const dayName  = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][now.getDay()];
    const todayStr = now.toISOString().split("T")[0];
    const nativeOk = typeof Notification !== "undefined" && Notification.permission === "granted";

    schedClasses.filter(c => c.days.includes(dayName)).forEach(cls => {
      const [h, m] = cls.startTime.split(":").map(Number);
      const notifAt15 = new Date(); notifAt15.setHours(h, m - 15, 0, 0);
      const notifAt0  = new Date(); notifAt0.setHours(h, m, 0, 0);
      const diff15 = notifAt15 - now;
      const diff0  = notifAt0  - now;
      const detail = `${cls.startTime}–${cls.endTime}${cls.room ? " · " + cls.room : ""}`;
      if (diff15 > 0) {
        setTimeout(() => {
          showToast(`Class in 15 min: ${cls.name}`, detail, "📚");
          if (nativeOk) new Notification(`Class in 15 min: ${cls.name}`, { body: detail });
        }, diff15);
      }
      if (diff0 > 0) {
        setTimeout(() => {
          showToast(`Class starting now: ${cls.name}`, detail, "🔔");
          if (nativeOk) new Notification(`Class starting now: ${cls.name}`, { body: detail });
        }, diff0);
      }
    });

    schedEvts.filter(e => e.date === todayStr).forEach(evt => {
      const label  = `${evt.type.toUpperCase()} today: ${evt.subject}`;
      const detail = `${evt.time}${evt.notes ? " · " + evt.notes : ""}`;
      showToast(label, detail, evt.type === "exam" ? "📝" : "✏️");
      if (nativeOk) new Notification(label, { body: detail });
    });
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  syncAcadToSubjects();
  scheduleNotificationsToday();
  render();
</script>
<div id="toast-container" aria-live="polite"></div>
</body>
</html>
